<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WLH Blog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== 导航栏 ========== -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="#/" class="nav-logo">WLH Blog</a>
      <ul class="nav-links">
        <li><a href="#/"      class="nav-link" id="nav-home">首页</a></li>
        <li><a href="#/new"   class="nav-link" id="nav-new">写文章</a></li>
      </ul>
    </div>
  </nav>

  <!--
    ========== SPA 挂载点 ==========
    所有页面内容（首页列表、文章详情、编辑器）均动态渲染到此 div
    路由变化时替换 innerHTML，实现无刷新页面切换（动态页面技术）
  -->
  <main id="app" class="app-container"></main>

  <footer class="footer">
    <p>&copy; 2026 王邻皓 · WLH Blog · 数据存储于浏览器 localStorage</p>
  </footer>

  <!--
    脚本加载顺序（顺序不可打乱，后者依赖前者）：
      store.js  — 数据库层（localStorage CRUD）
      router.js — SPA 路由（hash 监听）
      md.js     — Markdown 渲染器
      app.js    — 页面渲染逻辑 & 事件绑定 & 初始化
  -->
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/md.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
